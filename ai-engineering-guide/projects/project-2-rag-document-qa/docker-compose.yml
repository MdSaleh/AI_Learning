version: "3.9"
services:
  api:
    build: .
    ports: ["8001:8000"]
    environment:
      - ENV=development
    volumes:
      - ./data:/app/data
      - ./app:/app/app
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports: ["9091:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  grafana_data:
